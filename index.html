<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gerador de Termo de Equipamentos</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="wrap">
        <header>
            <h1>Termo de Entrega de Equipamentos</h1>
            <p>Funciona abrindo o arquivo diretamente no Edge/Chrome. Não usa Node.js.</p>
        </header>
        <form id="contractForm">
            <section>
                <h2>Chamado</h2>
                <div class="grid"><label>Número do incidente<input name="Num_incident" required
                            placeholder="I2610-3351"></label></div>
            </section>
            <section>
                <h2>Equipamento</h2>
                <div class="grid">
                    <label>Marca<input name="Equip_marca" required></label><label>Modelo<input name="Equip_modelo"
                            required></label>
                    <label>Número de série<input name="Equip_serial" required></label><label>Hostname<input
                            name="Equip_hostname" required></label>
                    <label>Patrimônio<input name="Equip_patrimonio" required></label>
                </div>
            </section>
            <section>
                <h2>Colaborador</h2>
                <div class="grid">
                    <label>Nome<input name="Colab_nome" required></label><label>Cargo<input name="Colab_cargo"
                            required></label>
                    <label>Área<input name="Colab_area" required></label><label>Local/Unidade<input name="Colab_local"
                            required></label>
                    <label>Centro de custo<input name="Colab_custo" required></label><label>Gestor<input
                            name="Colab_gestor" required></label>
                    <label>E-mail<input type="email" name="Colab_email" required></label>
                </div>
            </section>
            <section>
                <h2>Assinatura</h2>
                <div class="grid"><label>Data<input type="date" name="Ass_data" required></label></div>
            </section>
            <div class="actions"><button type="submit">Registrar e gerar contrato</button><button type="button"
                    class="secondary" id="exportLog">Exportar histórico CSV</button><button type="button" class="light"
                    id="clearLog">Limpar histórico</button></div>
            <div id="status" class="status"></div>
        </form>
        <section>
            <h2>Histórico deste navegador</h2>
            <div class="table">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Data/hora</th>
                            <th>Incidente</th>
                            <th>Colaborador</th>
                            <th>Hostname</th>
                            <th>Patrimônio</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="history"></tbody>
                </table>
            </div>
        </section>
    </main>
    <!-- Scripts clássicos de propósito: funcionam em file:// sem servidor local. -->
    <script src="js/storage.js"></script>
    <script src="js/contract.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
